# Local development only. Every value comes from the root .env (copied from
# .env.example), the same file Nx reads, and nothing here overrides it. The
# app containers use the host's network, so localhost in .env means the same
# inside and outside them. Two modes:
#   docker compose up -d                  databases and admin panels, apps run locally
#   docker compose --profile apps watch   everything in Docker, synced on change
name: boilerplate-angular-nest

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5.5.1
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - '127.0.0.1:${ADMINER_PORT}:8080'
    depends_on:
      - postgres

  # Same image as in the cluster. Valkey is compatible with Redis.
  valkey:
    image: valkey/valkey:9.0.6-alpine
    # Like in the cluster: the default user is off, apps log in with a user.
    command:
      [
        valkey-server,
        --user,
        default,
        'off',
        --user,
        '${VALKEY_USER}',
        'on',
        '>${VALKEY_PASSWORD}',
        '~*',
        '&*',
        '+@all',
      ]
    ports:
      - '127.0.0.1:${VALKEY_PORT}:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'valkey-cli',
          '--user',
          '${VALKEY_USER}',
          '--pass',
          '${VALKEY_PASSWORD}',
          '--no-auth-warning',
          'ping',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Shows the valkey connection after you accept the licence on first open.
  redisinsight:
    image: redis/redisinsight:3.8.0
    environment:
      RI_REDIS_HOST0: valkey
      RI_REDIS_ALIAS0: valkey
      RI_REDIS_USERNAME0: ${VALKEY_USER}
      RI_REDIS_PASSWORD0: ${VALKEY_PASSWORD}
    ports:
      - '127.0.0.1:${REDISINSIGHT_PORT}:5540'
    volumes:
      - redisinsight-data:/data
    depends_on:
      - valkey

  api:
    profiles: [apps]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    # Like in the cluster, migrations run before the API starts.
    command:
      [
        sh,
        -c,
        'pnpm nx run api:migrate && pnpm nx run api:seed && pnpm nx serve api',
      ]
    env_file:
      - path: .env
        required: true
    # Docker Desktop on macOS and Windows needs host networking turned on,
    # see docs/development/setup.md#option-a.
    network_mode: host
    volumes:
      - media:/app/${MEDIA_DIR}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app/apps/api
        - action: sync
          path: ./libs
          target: /app/libs
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  web:
    profiles: [apps]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    env_file:
      - path: .env
        required: true
    network_mode: host
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app/apps/web
        - action: sync
          path: ./libs
          target: /app/libs
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

volumes:
  postgres-data:
  valkey-data:
  redisinsight-data:
  media:

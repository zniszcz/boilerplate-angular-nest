# Local development only. Two modes:
#   docker compose up -d                  databases and admin panels, apps run locally
#   docker compose --profile apps watch   everything in Docker, synced on change
name: boilerplate-angular-nest

services:
  postgres:
    image: postgres:18.6
    environment:
      # Local development credentials, not used anywhere else.
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5.5.1
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - '127.0.0.1:${ADMINER_PORT:-8080}:8080'
    depends_on:
      - postgres

  # Same image as in the cluster. Valkey is compatible with Redis.
  valkey:
    image: valkey/valkey:9.0.6-alpine
    # Like in the cluster: the default user is off, apps log in with a user.
    command:
      [
        valkey-server,
        --user,
        default,
        'off',
        --user,
        app,
        'on',
        '>app',
        '~*',
        '&*',
        '+@all',
      ]
    ports:
      - '127.0.0.1:${VALKEY_PORT:-6379}:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'valkey-cli',
          '--user',
          'app',
          '--pass',
          'app',
          '--no-auth-warning',
          'ping',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Shows the valkey connection after you accept the licence on first open.
  redisinsight:
    image: redis/redisinsight:3.8.0
    environment:
      RI_REDIS_HOST0: valkey
      RI_REDIS_ALIAS0: valkey
      RI_REDIS_USERNAME0: app
      RI_REDIS_PASSWORD0: app
    ports:
      - '127.0.0.1:${REDISINSIGHT_PORT:-5540}:5540'
    volumes:
      - redisinsight-data:/data
    depends_on:
      - valkey

  api:
    profiles: [apps]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    # Like in the cluster, migrations run before the API starts.
    command:
      [
        sh,
        -c,
        'pnpm nx run api:migrate && pnpm nx run api:seed && pnpm nx serve api',
      ]
    environment:
      PORT: 3000
      LOG_LEVEL: debug
      MEDIA_DIR: /app/media
      DATABASE_URL: postgres://app:app@postgres:5432/app
      REDIS_URL: redis://app:app@valkey:6379
      SWAGGER_ENABLED: 'true'
      # Local development values only. In the cluster they come from 1Password.
      JWT_SECRET: local-dev-jwt-secret
      SEED_USER_EMAIL: admin@example.com
      SEED_USER_PASSWORD: admin
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app/apps/api
        - action: sync
          path: ./libs
          target: /app/libs
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  web:
    profiles: [apps]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - '127.0.0.1:${WEB_PORT:-4200}:4200'
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app/apps/web
        - action: sync
          path: ./libs
          target: /app/libs
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

volumes:
  postgres-data:
  valkey-data:
  redisinsight-data:
  media:

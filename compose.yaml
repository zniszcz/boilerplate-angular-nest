# Local development only. Two modes:
#   docker compose up -d                  database and Adminer, apps run locally
#   docker compose --profile apps watch   everything in Docker, synced on change
name: boilerplate-angular-nest

services:
  postgres:
    image: postgres:18.6
    environment:
      # Local development credentials, not used anywhere else.
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5.5.1
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - '127.0.0.1:${ADMINER_PORT:-8080}:8080'
    depends_on:
      - postgres

  api:
    profiles: [apps]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      PORT: 3000
      LOG_LEVEL: debug
      MEDIA_DIR: /app/media
      DATABASE_URL: postgres://app:app@postgres:5432/app
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app/apps/api
        - action: sync
          path: ./libs
          target: /app/libs
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  web:
    profiles: [apps]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    ports:
      - '127.0.0.1:${WEB_PORT:-4200}:4200'
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app/apps/web
        - action: sync
          path: ./libs
          target: /app/libs
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

volumes:
  postgres-data:
  media:

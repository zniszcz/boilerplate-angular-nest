# Settings of the agent fleet in this repository, read by fleet-lib.sh. How it
# works: docs/development/agent-fleet.md. An environment variable of the same
# name wins. Values without quotes, one per line. A fork changes what differs.

# Prefix of the tmux sessions (<name>-manager, <name>-fleet), Remote Control
# names and the guard's stop file (~/.<name>-guard-stop). Empty: the folder name.
FLEET_NAME=
# Task branches start from origin/main and come back by pull request.
FLEET_MAIN=main
# Path prefix workers may change; empty means the whole repository.
FLEET_SCOPE=
# github: the audit reads GitHub Actions checks on each PR (the default, see
# docs/development/ci-runners.md). local: the manager runs FLEET_GATES_CMD and
# the audit reads its marker, for a private fork without free CI.
FLEET_GATES=github
FLEET_GATES_CMD=scripts/ci-local.sh
# The guide for the human whose age the audit watches.
FLEET_GUIDE=docs/what-to-read.md
FLEET_GUIDE_DOCS=docs
FLEET_GUIDE_COMMANDS=scripts
# Stop and pause files in the repository root, written only by the human.
FLEET_STOP_FILE=fleet.stop
FLEET_PAUSE_FILE=fleet.pause
# Where the worker and reviewer briefs live, and the skills they start with.
FLEET_BRIEF_DIR=.agents/skills/manage-fleet
FLEET_WORKER_SKILL=ship-feature
FLEET_REVIEWER_SKILL=review-project
# A worker's worktree is an isolated instance (ADR 0030): removing it also
# drops its database and ports.
FLEET_TEARDOWN_HOOK=node scripts/instances.mjs down

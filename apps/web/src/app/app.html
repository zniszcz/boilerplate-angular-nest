<header>
  <label>
    {{ 'app.language' | transloco }}
    <select #select (change)="setLanguage(select.value)">
      @for (language of languages; track language) {
        <option [value]="language" [selected]="language === activeLanguage()">
          {{ language }}
        </option>
      }
    </select>
  </label>
</header>

<main>
  <router-outlet />
</main>

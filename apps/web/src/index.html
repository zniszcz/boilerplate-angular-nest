<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>web</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <!-- Shown until Angular starts and replaces it. No script and no inline
         style, so the strict CSP stays. It fades in only after 150ms. -->
    <app-root>
      <div class="boot-indicator flex min-h-dvh items-center justify-center">
        <div
          class="border-muted border-t-primary size-8 animate-spin rounded-full border-4"
          role="status"
          aria-label="Loading"
        ></div>
      </div>
    </app-root>
  </body>
</html>

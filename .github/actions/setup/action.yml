# Node.js, pnpm and the dependencies, plus the Nx cache of this job. Every
# CI job starts with it after the checkout. The pnpm store is cached by
# setup-node; the Nx cache lets lint, build and tests skip projects that did
# not change since the last run of the same job.
name: Set up the workspace
description: Node.js, pnpm, dependencies and the Nx cache
inputs:
  job:
    description: Name of the job, so each job keeps its own Nx cache
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    # The one settings file, as on a developer's machine; Nx loads it.
    - name: Settings from .env.example
      shell: bash
      run: cp .env.example .env
    # This branch's latest, or main's on a new branch, like every cache here.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .nx/cache
        key: nx-${{ inputs.job }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: nx-${{ inputs.job }}-

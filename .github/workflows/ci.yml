# Every push to any branch checks the whole repository (trunk-based: short
# branches into main); images are built only on main, for the apps that
# changed since its last successful run. See docs/adr/0019-ci-pipeline.md
# and docs/adr/0024-ci-on-every-branch.md. Actions are pinned to a commit, with the
# release in the comment, like every other dependency.
name: CI

on:
  push:
    branches: ['**']
    # Documentation alone changes nothing that runs.
    paths-ignore: ['**/*.md', 'docs/**']
  # Only for pull requests from forks, whose pushes run no CI here. A pull
  # request from a branch of this repository is checked by its push run.
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_NO_CLOUD: true

# Five jobs side by side, one per kind of check, so the run's graph shows at a
# glance which one failed. Each sets up the workspace the same way
# (.github/actions/setup) and keeps its own Nx cache.
jobs:
  static:
    name: Static checks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          job: static
      - name: Exact versions
        run: pnpm versions
      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: DDD layers and cycles
        run: pnpm architecture
      - name: API types match the backend
        run: pnpm contracts:check
      - name: Generated docs lists
        run: pnpm docs:check
      - name: Save the Nx cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-static-${{ github.ref_name }}-${{ github.sha }}

  build:
    name: Build and Storybook
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          job: build
      - name: Build the apps
        run: pnpm build
      - name: Build Storybook
        run: pnpm nx run storybook:build-storybook
      - name: Save the Nx cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-build-${{ github.ref_name }}-${{ github.sha }}

  test:
    name: Unit and API tests
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          job: test
      # API tests start PostgreSQL in Docker, which the runner has.
      - name: Unit and API tests
        run: pnpm test
      - name: Save the Nx cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-test-${{ github.ref_name }}-${{ github.sha }}

  mutation:
    name: Mutation testing
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          job: mutation
      # Results of the last run, so only mutants in changed code run again:
      # this branch's latest, or main's on a new branch. Each branch saves
      # its own; the nightly full run refreshes main's. See
      # docs/adr/0022-mutation-testing.md.
      - name: Restore earlier Stryker results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/incremental.json
          key: mutation-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: mutation-
      - name: Stryker
        run: pnpm mutate
      - name: Keep the results for the summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: summary-mutation
          path: reports/mutation/mutation.json
          if-no-files-found: ignore
      - name: Save Stryker results
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/incremental.json
          key: mutation-${{ github.ref_name }}-${{ github.sha }}
      - name: Upload the HTML report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation/index.html
      - name: Save the Nx cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-mutation-${{ github.ref_name }}-${{ github.sha }}

  e2e:
    name: End-to-end
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          job: e2e
      # Browsers are cached per Playwright version; the system libraries
      # they need still come from apt.
      - name: Restore Chromium
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Save Chromium
        if: steps.browsers.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: System libraries for Chromium
        run: pnpm exec playwright install-deps chromium
      # Scenarios from apps/web-e2e/features on the built apps.
      - name: Scenarios
        run: pnpm e2e
      - name: Keep the results for the summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: summary-e2e
          path: reports/e2e/results.json
          if-no-files-found: ignore
      - name: Upload the report with traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            reports/e2e/html
            tmp/e2e-results
      - name: Save the Nx cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-e2e-${{ github.ref_name }}-${{ github.sha }}

  summary:
    name: Summary
    needs: [static, build, test, mutation, e2e]
    # Also after a failure: that is when the summary matters most.
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Results of the other jobs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: summary-*
          merge-multiple: true
          path: summary
      - name: Write the summary
        run: node scripts/ci-summary.mjs
        env:
          RESULTS: ${{ toJSON(needs) }}

  changes:
    name: Find changed apps
    needs: [static, build, test, mutation, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # nx-set-shas reads past runs to find the last successful one.
      actions: read
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # NX_BASE: the commit of the last successful run on main, so a failed
      # run is built again next time instead of being skipped.
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          # No successful run yet: compare with git's empty tree, so the first
          # run builds every image.
          fallback-sha: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
      - id: apps
        run: echo "apps=$(node scripts/changed-images.mjs)" >> "$GITHUB_OUTPUT"

  images:
    name: Image ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: prod
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      # The image that passes is the one that gets pushed, not a rebuild.
      - name: Test
        run: scripts/test-prod-images.sh ${{ matrix.app }}
        env:
          BUILD: 0
          API_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          WEB_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: docker push --all-tags "$IMAGE"

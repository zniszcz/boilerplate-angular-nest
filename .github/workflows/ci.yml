# "Check the branch alone": every push to any branch checks the whole
# repository (trunk-based: short branches into main), with the jobs in
# checks.yml. On main, images are then built for the apps that changed since
# its last successful run. The merged result of a pull request is checked by
# merge.yml. See docs/adr/0019-ci-pipeline.md and docs/adr/0024-ci-on-every-
# branch.md. Actions are pinned to a commit, with the release in the comment,
# like every other dependency.
name: Check the branch alone

on:
  push:
    branches: ['**']
    # Documentation alone changes nothing that runs.
    paths-ignore: ['**/*.md', 'docs/**']

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: branch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_NO_CLOUD: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  changes:
    name: Find apps to publish (main only)
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # nx-set-shas reads past runs to find the last successful one.
      actions: read
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # NX_BASE: the commit of the last successful run on main, so a failed
      # run is built again next time instead of being skipped.
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          # No successful run yet: compare with git's empty tree, so the first
          # run builds every image.
          fallback-sha: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
      - id: apps
        run: echo "apps=$(node scripts/changed-images.mjs)" >> "$GITHUB_OUTPUT"

  images:
    # Without a matrix value in the name, GitHub appends it: (api), (web).
    name: Publish image to GHCR
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: prod
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      # The image that passes is the one that gets pushed, not a rebuild.
      - name: Test the image as the cluster runs it
        run: scripts/test-prod-images.sh ${{ matrix.app }}
        env:
          BUILD: 0
          API_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          WEB_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        run: docker push --all-tags "$IMAGE"
      # Keeps the 10 newest versions and any tagged prod; see the script.
      - name: Delete old versions from GHCR
        run: scripts/prune-images.sh ${{ matrix.app }} 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One line about images on the run's page, also on branches, where none
  # are published.
  publish-summary:
    name: Publish summary
    needs: [changes, images]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Write the summary
        env:
          REF: ${{ github.ref }}
          APPS: ${{ needs.changes.outputs.apps }}
          RESULT: ${{ needs.images.result }}
          IMAGE: ghcr.io/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo '## Images'
            echo
            if [ "$REF" != refs/heads/main ]; then
              echo '⚪ Not published: images are published only from `main`.'
            elif [ -z "$APPS" ] || [ "$APPS" = '[]' ]; then
              echo '⚪ Not published: no app changed since the last successful run.'
            else
              icon=$([ "$RESULT" = success ] && echo ✅ || echo ❌)
              echo 'Older versions beyond the 10 newest are deleted, except any tagged `prod`.'
              echo
              echo '| | Image | Tags |'
              echo '| --- | --- | --- |'
              for app in $(echo "$APPS" | tr -d '[]"' | tr ',' ' '); do
                echo "| $icon | \`$IMAGE/$app\` | \`latest\`, \`$SHA\` |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

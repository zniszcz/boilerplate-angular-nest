# Every run checks the whole repository; images are built only for the apps
# that changed since the last successful run on main. See
# docs/adr/0019-ci-pipeline.md. Actions are pinned to a commit, with the
# release in the comment, like every other dependency.
name: CI

on:
  push:
    branches: [main]
    # Documentation alone changes nothing that runs.
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_NO_CLOUD: true

jobs:
  verify:
    name: Verify the whole repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm versions
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm architecture
      - run: pnpm build
      # API tests start PostgreSQL in Docker, which the runner has.
      - run: pnpm test
      - run: pnpm mutate
      # Scenarios from apps/web-e2e/features on the built apps, in Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm nx run storybook:build-storybook
      - run: pnpm contracts:check
      - run: pnpm docs:check

  changes:
    name: Find changed apps
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # nx-set-shas reads past runs to find the last successful one.
      actions: read
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # NX_BASE: the commit of the last successful run on main, so a failed
      # run is built again next time instead of being skipped.
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          # No successful run yet: compare with git's empty tree, so the first
          # run builds every image.
          fallback-sha: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
      - id: apps
        run: echo "apps=$(node scripts/changed-images.mjs)" >> "$GITHUB_OUTPUT"

  images:
    name: Image ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: prod
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      # The image that passes is the one that gets pushed, not a rebuild.
      - name: Test
        run: scripts/test-prod-images.sh ${{ matrix.app }}
        env:
          BUILD: 0
          API_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          WEB_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: docker push --all-tags "$IMAGE"

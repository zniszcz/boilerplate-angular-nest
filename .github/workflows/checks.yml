# The checks of the whole repository, shared by two workflows: Branch checks
# (ci.yml) runs them on every push to a branch, Merge with main (merge.yml)
# on a pull request, against the branch merged with the current main. See
# docs/adr/0025-ci-jobs-and-caches.md.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  NX_NO_CLOUD: true

# Five jobs side by side, one per kind of check, so the run's graph shows at a
# glance which one failed. Each sets up the workspace the same way
# (.github/actions/setup) and keeps its own Nx cache.
jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          job: static
      - name: Exact versions
        run: pnpm versions
      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: DDD layers and cycles
        run: pnpm architecture
      - name: API types match the backend
        run: pnpm contracts:check
      - name: Generated docs lists
        run: pnpm docs:check
      - name: Save the Nx cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-static-${{ github.ref_name }}-${{ github.sha }}

  build:
    name: Build and Storybook
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          job: build
      - name: Build the apps
        run: pnpm build
      - name: Build Storybook
        run: pnpm nx run storybook:build-storybook
      - name: Save the Nx cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-build-${{ github.ref_name }}-${{ github.sha }}

  test:
    name: Unit and API tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          job: test
      # API tests start PostgreSQL in Docker, which the runner has.
      - name: Unit and API tests
        run: pnpm test
      - name: Save the Nx cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-test-${{ github.ref_name }}-${{ github.sha }}

  mutation:
    name: Mutation testing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          job: mutation
      # Results of the last run, so only mutants in changed code run again:
      # this branch's latest, or main's on a new branch. Each branch saves
      # its own; the nightly full run refreshes main's. See
      # docs/adr/0022-mutation-testing.md.
      - name: Restore earlier Stryker results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/incremental.json
          key: mutation-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: mutation-
      - name: Stryker
        run: pnpm mutate
      - name: Keep the results for the summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: summary-mutation
          path: reports/mutation/mutation.json
          if-no-files-found: ignore
      - name: Save Stryker results
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/incremental.json
          key: mutation-${{ github.ref_name }}-${{ github.sha }}
      - name: Upload the HTML report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation/index.html
      - name: Save the Nx cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-mutation-${{ github.ref_name }}-${{ github.sha }}

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          job: e2e
      # Browsers are cached per Playwright version; the system libraries
      # they need still come from apt.
      - name: Restore Chromium
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Save Chromium
        if: steps.browsers.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: System libraries for Chromium
        run: pnpm exec playwright install-deps chromium
      # Scenarios from apps/web-e2e/features on the built apps.
      - name: Scenarios
        run: pnpm e2e
      - name: Keep the results for the summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: summary-e2e
          path: reports/e2e/results.json
          if-no-files-found: ignore
      - name: Upload the report with traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            reports/e2e/html
            tmp/e2e-results
      - name: Save the Nx cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-e2e-${{ github.ref_name }}-${{ github.sha }}

  summary:
    name: Summary
    needs: [static, build, test, mutation, e2e]
    # Also after a failure: that is when the summary matters most.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Results of the other jobs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: summary-*
          merge-multiple: true
          path: summary
      - name: Write the summary
        run: node scripts/ci-summary.mjs
        env:
          RESULTS: ${{ toJSON(needs) }}

# "Check the docs alone": the other workflows skip a push that changes only
# Markdown, so this one checks the generated lists and the agent skills on
# such a push. See docs/adr/0028-agent-skills.md.
name: Check the docs alone

on:
  push:
    branches: ['**']
    paths: ['**/*.md', 'docs/**', '.agents/**', '.claude/**']

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Generated docs lists and skills
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Formatting of the docs
        run: pnpm exec prettier --check '**/*.md'
      - name: Generated docs lists and skills
        run: pnpm docs:check

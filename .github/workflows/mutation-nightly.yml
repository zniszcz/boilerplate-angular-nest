# A full mutation run every night. Incremental runs in CI trust earlier
# results for code that did not change; a change elsewhere, such as a
# migration or a dependency, could leave a result stale. This run checks
# every mutant again and saves fresh results for the next CI runs. See
# docs/adr/0022-mutation-testing.md.
name: Rerun all mutation tests nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NX_NO_CLOUD: true

jobs:
  mutate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutate --force
      # Saved even when the score is under the threshold, so CI shows the
      # same survivors instead of running everything again.
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/incremental.json
          key: mutation-nightly-${{ github.run_id }}

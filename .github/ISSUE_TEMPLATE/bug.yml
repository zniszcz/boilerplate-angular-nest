# Every bug reported here escaped the tests. The label lets CI demand a test
# in the fix. See docs/adr/0021-testing-strategy.md.
name: Bug
description: Something works differently than it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

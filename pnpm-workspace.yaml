saveExact: true
savePrefix: ''
engineStrict: true
allowBuilds:
  '@parcel/watcher': true
  nx: true
  unrs-resolver: true
  '@nestjs/core': false
  # Usage telemetry of swagger-ui-dist, not needed.
  '@scarf/scarf': false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  '@swc/core': true
  # Native speedups of the SSH client in testcontainers, unused: Docker runs
  # on a local socket.
  cpu-features: false
  ssh2: false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@angular/common@22.2.1'
  - '@angular/compiler@22.2.1'
  - '@angular/core@22.2.1'
  - '@angular/forms@22.2.1'
  - '@angular/platform-browser@22.2.1'
  - '@angular/router@22.2.1'
  - '@angular-devkit/architect@0.2202.1'
  - '@angular-devkit/core@22.2.1'
  - '@angular-devkit/schematics@22.2.1'
  - '@angular/build@22.2.1'
  - '@angular/cli@22.2.1'
  - '@angular/compiler-cli@22.2.1'
  - '@angular/language-service@22.2.1'
  - '@schematics/angular@22.2.1'
  - globals@17.13.0
  - '@spartan-ng/brain@1.6.0'
  - '@spartan-ng/cli@1.6.0'
